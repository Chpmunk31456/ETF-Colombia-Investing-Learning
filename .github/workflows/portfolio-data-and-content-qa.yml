name: Portfolio Data and Content QA

on:
  push:
    branches:
      - main
      - production/**
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-repository:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate CSV files
        shell: pwsh
        run: ./scripts/Test-PortfolioCsvQuality.ps1

      - name: Validate Markdown files
        shell: pwsh
        run: ./scripts/Test-PortfolioMarkdownQuality.ps1
